name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR convention
        if: github.event_name == 'pull_request'
        run: python3 tools/ci/check_pr.py
      - name: Test policy checker
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Install C analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-18 cppcheck
      - name: Check maintained C code
        run: python3 tools/ci/check_c.py
